name: Android CI

on:
  push:
    branches: [ main ]
    tags: "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: gradle
      
      # Determine Version
      - name: Extract Version
        id: version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: echo "::set-output name=version::$(echo ${GITHUB_REF#refs/tags/v})"

      - name: Setup local.properties - version name default
        run: echo versionName="rc" > ./local.properties 
      - name: Setup local.properties - version name
        if: steps.version.outputs.version != ''
        run: echo versionName="${{ steps.version.outputs.version }}" > ./local.properties 
      - name: Setup local.properties
        run: |
          echo versionCode="${{ github.run_number }}" >> ./local.properties
          echo couchbaseSyncUrl="${{ secrets.COUCHBASE_SYNC_URL }}" >> ./local.properties
          echo appCenterApiKey="${{ secrets.APP_CENTER_API_KEY }}" >> ./local.properties
        
      - name: Read local.properties
        id: properties
        uses: juliangruber/read-file-action@v1
        with:
          path: ./local.properties
      - name: Echo local.properties
        run: echo "${{ steps.properties.outputs.content }}"

      # Build
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Release
        run: ./gradlew assembleRelease

      # Deploy
      - uses: r0adkll/sign-android-release@v1
        name: Sign App APK
        if: steps.version.outputs.version != ''
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_FILE }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          # override default build-tools version (29.0.3) -- optional
          BUILD_TOOLS_VERSION: "30.0.2"
      - uses: vhsantos26/app-center-cli-action@v1
        name: Upload to App Center
        if: steps.version.outputs.version != ''
        with:
          user_token: ${{ secrets.APP_CENTER_TOKEN }}
          command: appcenter distribute release --app ${{ secrets.APP_CENTER_APP }} --file ${{ steps.sign_app.outputs.signedReleaseFile }} --group Collaborators