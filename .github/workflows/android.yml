name: Android CI

on:
  push:
    branches: [ main ]
    tags: "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle
      
      # Determine Version
      - name: Extract Version
        id: version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Setup local.properties - version name default
        run: echo versionName="rc" > ./local.properties 
      - name: Setup local.properties - version name
        if: steps.version.outputs.VERSION != ''
        run: echo versionName="${{ steps.version.outputs.VERSION }}" > ./local.properties
      - name: Setup local.properties
        run: |
          echo versionCode="${{ github.run_number }}" >> ./local.properties
          echo couchbaseSyncUrl="${{ secrets.COUCHBASE_SYNC_URL }}" >> ./local.properties
          echo appCenterApiKey="${{ secrets.APP_CENTER_API_KEY }}" >> ./local.properties
        
      - name: Read local.properties
        id: properties
        uses: juliangruber/read-file-action@v1
        with:
          path: ./local.properties
      - name: Echo local.properties
        run: echo "${{ steps.properties.outputs.content }}"

      # Build
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Release
        run: ./gradlew assembleRelease

      # Deploy
      - name: Sign App APK
        uses: ilharp/sign-android-release@v1
        if: steps.version.outputs.VERSION != ''
        id: sign_app
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_FILE }}
          keyAlias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
          buildToolsVersion: 33.0.0
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: steps.version.outputs.VERSION != ''
        with:
          name: apk
          path: ${{ steps.sign_app.outputs.signedFile }}