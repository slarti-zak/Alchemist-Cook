name: Android CI

on:
  push:
    branches: [ main ]
    tags: "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      # Determine Version
      - name: Extract Version
        id: version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Setup local.properties - version name default
        run: echo versionName="rc" > ./local.properties
      - name: Setup local.properties - version name
        if: steps.version.outputs.VERSION != ''
        run: echo versionName="${{ steps.version.outputs.VERSION }}" > ./local.properties
      - name: Setup local.properties
        run: |
          echo versionCode="${{ github.run_number }}" >> ./local.properties
          echo couchbaseSyncUrl="${{ secrets.COUCHBASE_SYNC_URL }}" >> ./local.properties

      # Build
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Tests
        run: ./gradlew test
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
      - name: Build Release
        run: ./gradlew assembleRelease

      # Deploy
      - name: Sign App APK
        uses: ilharp/sign-android-release@v1
        if: steps.version.outputs.VERSION != ''
        id: sign_app
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_FILE }}
          keyAlias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
          buildToolsVersion: 37.0.0
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: steps.version.outputs.VERSION != ''
        with:
          name: apk
          path: ${{ steps.sign_app.outputs.signedFile }}