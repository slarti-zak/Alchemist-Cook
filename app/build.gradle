plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'

    // https://github.com/ben-manes/gradle-versions-plugin
    id "com.github.ben-manes.versions" version "0.51.0"
}

android {
    compileSdk 35
//    buildToolsVersion "30.0.3"
    defaultConfig {
        applicationId "click.alchemist.cook"
        manifestPlaceholders = [applicationLabel: "@string/app_name"]
        minSdkVersion 22
        targetSdkVersion 35
        versionCode project.versionCode.toInteger()
        versionName project.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            manifestPlaceholders = [applicationLabel: "Cook Debug"]
            debuggable true
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    kotlinOptions {
        //useIR = true
    }

    buildFeatures {
        dataBinding false
        viewBinding false
        compose true

        // Disable unused AGP features
//        buildConfig false
        aidl false
        renderScript false
//        resValues false
        shaders false
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE-LGPL-3.txt', 'META-INF/LICENSE-LGPL-2.1.txt', 'META-INF/LICENSE-W3C-TEST', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        checkReleaseBuilds false
    }
    namespace 'click.alchemist.cook'

}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += [
                '-XXLanguage:+InlineClasses',
                '-opt-in=kotlin.time.ExperimentalTime',
                '-opt-in=kotlin.contracts.ExperimentalContracts',
                '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
                '-opt-in=kotlinx.coroutines.FlowPreview',
                '-opt-in=androidx.compose.ui.ExperimentalComposeUiApi',
                '-opt-in=androidx.compose.animation.ExperimentalAnimationApi',
                '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi',
                '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
                '-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi',
                '-opt-in=androidx.compose.animation.ExperimentalSharedTransitionApi'
//              '-P', 'plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true'
        ]
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.work:work-runtime:2.10.0'

    implementation "androidx.compose.runtime:runtime:$compose_version"
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation "androidx.compose.foundation:foundation:$compose_version"
    implementation "androidx.compose.foundation:foundation-layout:$compose_version"

    implementation 'androidx.compose.material3:material3-android:1.3.1'

    implementation "androidx.navigation:navigation-compose:2.8.5"

    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    implementation 'com.couchbase.lite:couchbase-lite-android-ktx:3.2.1'

    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:editor:4.6.2'
    implementation 'io.noties.markwon:simple-ext:4.6.2'

    // https://github.com/Calvin-LL/Reorderable/
    implementation 'sh.calvin.reorderable:reorderable:2.4.2'

    // https://github.com/InsertKoinIO/koin
    def koin_version = '3.5.6'
    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-androidx-compose:$koin_version"
    implementation "io.insert-koin:koin-androidx-workmanager:$koin_version"

    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.18.2'

    // https://github.com/google/accompanist
    implementation 'com.google.accompanist:accompanist-pager:0.36.0'

    // https://github.com/coil-kt/coil
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // https://github.com/onebone/compose-collapsing-toolbar
    implementation 'me.onebone:toolbar-compose:2.3.5'

    implementation 'com.vladsch.flexmark:flexmark:0.64.8'
//    implementation 'com.vladsch.flexmark:flexmark-all:0.64.0'
//    implementation 'com.vladsch.flexmark:flexmark-html-parser:0.50.50'

    def appCenterSdkVersion = '4.4.3'
    implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-distribute:${appCenterSdkVersion}"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
